version: '3.8'

services:
  db:
    image: rkdocker1800/library:db_image
    ports:
      - "3306:3306"
    networks:
      - mynetwork

  auth_service:
    image: rkdocker1800/library:auth_image
    ports:
      - "5001:5001"
    networks:
      - mynetwork
    depends_on:
      - db

  book_service:
    image: rkdocker1800/library:book_image
    ports:
      - "5002:5002"
    networks:
      - mynetwork
    depends_on:
      - db

  borrow_service:
    image: rkdocker1800/library:borrow_image
    ports:
      - "5003:5003"
    networks:
      - mynetwork
    depends_on:
      - db

  frontend:
    image: rkdocker1800/library:frontend_image
    ports:
      - "5000:5000"
    networks:
      - mynetwork
    depends_on:
      - auth_service   # FIXED: Changed from 'auth' to 'auth_service'
      - book_service   # FIXED: Changed from 'book' to 'book_service'
      - borrow_service # FIXED: Changed from 'borrow' to 'borrow_service'

networks:
  mynetwork:
    driver: bridge     # FIXED: Changed from 'overlay' to 'bridge'
